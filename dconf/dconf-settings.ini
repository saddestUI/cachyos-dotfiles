[org/gnome/desktop/interface]
cursor-size=24
cursor-theme='default'

[org/gnome/file-roller/listing]
list-mode='as-folder'
name-column-width=376
show-path=false
sort-method='name'
sort-type='ascending'

[org/gnome/file-roller/ui]
sidebar-width=200
window-height=480
window-width=600

[org/gtk/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=false
show-size-column=true
show-type-column=true
sidebar-width=177
sort-column='modified'
sort-directories-first=false
sort-order='ascending'
type-format='category'
window-position=(0, 0)
window-size=(926, 947)

[system/proxy]
mode='none'

[system/proxy/ftp]
host='127.0.0.1'
port=2080

[system/proxy/http]
host='127.0.0.1'
port=2080

[system/proxy/https]
host='127.0.0.1'
port=2080

[system/proxy/socks]
host='127.0.0.1'
port=2080
