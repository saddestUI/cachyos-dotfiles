[package]
name = "asura-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
cairo-rs = "0.18"
gdk = { version = "0.18", features = ["v3_24"] }
gdk-pixbuf = "0.18"
gio = "0.18"
glib = "0.18"
gtk = { version = "0.18", features = ["v3_24"] }
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
libc = "0.2"
pango = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
