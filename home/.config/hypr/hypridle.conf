general {
    lock_cmd = /home/samerim/.config/hypr/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
    inhibit_sleep = 3
}

# 2.5 min: smoothly dim display to 15%
listener {
    timeout = 150
    on-timeout = /home/samerim/.config/hypr/idle-brightness.sh dim
    on-resume = /home/samerim/.config/hypr/idle-brightness.sh restore
}

# 5 min: lock screen
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: turn off display (DPMS)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && /home/samerim/.config/hypr/idle-brightness.sh restore
}

# 15 min: suspend laptop
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
