# Asura-glass Hyprlock configuration (synced dynamically via wallfx)
source = /home/samerim/.config/hypr/hyprlock-theme.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = false
    fractional_scaling = 2
    text_trim = true
}

animations {
    enabled = true
    bezier = fluid, 0.16, 1, 0.30, 1
    bezier = smoothFade, 0.33, 1, 0.68, 1
    animation = fadeIn, 1, 5, smoothFade
    animation = fadeOut, 1, 4, smoothFade
    animation = inputFieldDots, 1, 2, fluid
    animation = inputFieldColors, 1, 3, smoothFade
    animation = inputFieldWidth, 1, 3, fluid
    animation = inputFieldFade, 1, 3, smoothFade
}

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.94
    brightness = 0.76
    vibrancy = 0.22
    vibrancy_darkness = 0.1
}

# CLOCK
label {
    monitor =
    text = $TIME
    color = $fg_bright
    font_size = 92
    font_family = MesloLGL Nerd Font Bold
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
}

# DATE (Russian)
label {
    monitor =
    text = cmd[update:60000] /home/samerim/.config/hypr/lock-status.sh date
    color = $fg
    font_size = 18
    font_family = Noto Sans Medium
    position = 0, 110
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# FROSTED-GLASS CARD
shape {
    monitor =
    size = 380, 196
    color = $bg_glass
    rounding = 18
    border_size = 1
    border_color = $border_subtle
    position = 0, -74
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.45)
}

# USERNAME
label {
    monitor =
    text = 󰌾  $USER
    color = $fg
    font_size = 14
    font_family = MesloLGL Nerd Font
    position = 0, -14
    halign = center
    valign = center
}

# PASSWORD INPUT
input-field {
    monitor =
    size = 310, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.30
    dots_center = true
    outer_color = $border_active
    inner_color = $bg_surface
    font_color = $fg_bright
    check_color = $check_ring
    fail_color = $error_ring
    capslock_color = $warn
    fade_on_empty = false
    rounding = 14
    font_family = Noto Sans
    placeholder_text = $placeholder
    fail_text = $fail_msg
    position = 0, -74
    halign = center
    valign = center
}

# KEYBOARD LAYOUT (clickable)
label {
    monitor =
    text = 󰌌  $LAYOUT[EN,RU]
    onclick = hyprctl switchxkblayout all next
    color = $accent
    font_size = 12
    font_family = MesloLGL Nerd Font
    position = 0, -134
    halign = center
    valign = center
}

# NOW PLAYING
label {
    monitor =
    text = cmd[update:3000] /home/samerim/.config/hypr/lock-status.sh media
    color = $fg
    font_size = 13
    font_family = Noto Sans
    position = 0, 52
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
}

# BATTERY
label {
    monitor =
    text = cmd[update:30000] /home/samerim/.config/hypr/lock-status.sh battery
    color = $fg
    font_size = 13
    font_family = MesloLGL Nerd Font
    position = -28, 24
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
}
