# Typography
font_family      MesloLGS Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
modify_font      cell_height 115%
disable_ligatures never

# Frosted-glass transparency (live-adjustable)
background_opacity         0.68
dynamic_background_opacity yes
map ctrl+shift+equal       set_background_opacity +0.05
map ctrl+shift+plus        set_background_opacity +0.05
map ctrl+shift+kp_add      set_background_opacity +0.05
map ctrl+shift+minus       set_background_opacity -0.05
map ctrl+shift+kp_subtract set_background_opacity -0.05
map ctrl+shift+0           set_background_opacity default

# Window spacing & polish
window_padding_width    14 18
placement_strategy      center
hide_window_decorations yes
confirm_os_window_close 0
draw_minimal_borders    yes
window_border_width     1pt

# Smooth animated cursor
cursor_shape                beam
cursor_beam_thickness       1.8
cursor_blink_interval       0.55 ease-in-out
cursor_stop_blinking_after  10.0
cursor_trail                3
cursor_trail_decay          0.10 0.35
cursor_trail_start_threshold 2

# Powerline tab bar (auto-hidden when 1 tab)
tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_min_tabs         2
tab_bar_margin_width     6.0
tab_bar_margin_height    4.0 0.0
tab_title_template       " {index}: {title} "
active_tab_font_style    bold
inactive_tab_font_style  normal

# Quality-of-life & performance
scrollback_lines  4000
url_style         curly
detect_urls       yes
enable_audio_bell no
visual_bell_duration 0.0
repaint_delay     10
input_delay       2
sync_to_monitor   yes
shell_integration enabled

# Wallpaper-synced palette (generated by wallfx)
include theme.conf
